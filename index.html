<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ben 10: Card Clash</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --green: #00ff88;
  --green-dark: #00cc66;
  --green-dim: rgba(0,255,136,0.15);
  --green-glow: rgba(0,255,136,0.4);
  --orange: #ff6b00;
  --bg: #050c07;
  --bg2: #0a160c;
  --bg3: #0f1e12;
  --border: #182d1c;
  --border2: #1e3822;
  --text: #dff0e2;
  --text-dim: #4a7a50;
  --text-mid: #8ab090;

  --row-power: #00ccff;
  --row-power-dim: rgba(0,204,255,0.12);
  --row-speed: #ffcc00;
  --row-speed-dim: rgba(255,204,0,0.12);
  --row-light: #ff88ff;
  --row-light-dim: rgba(255,136,255,0.12);
  --row-cosmic: #ffffff;

  --enemy: #ff3a4a;
  --enemy-dim: rgba(255,58,74,0.12);
  --enemy-glow: rgba(255,58,74,0.35);

  --card-w: 68px;
  --card-h: 96px;
  --card-w-sm: 56px;
  --card-h-sm: 78px;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Rajdhani', sans-serif; color:var(--text); }

/* ── SCREENS ── */
.screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--bg); }
.screen.hidden { display:none; }

/* ── GRID BG ── */
.screen::before {
  content:''; position:absolute; inset:0; pointer-events:none;
  background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size:48px 48px; opacity:0.35;
}

/* ════════════════════════════════
   MENU SCREEN
════════════════════════════════ */
#menuScreen { gap:0; justify-content:space-between; padding:44px 24px 52px; }

.logo-area { text-align:center; z-index:1; }
.logo-eyebrow { font-family:'Orbitron',monospace; font-size:10px; letter-spacing:0.4em; color:var(--text-dim); margin-bottom:10px; }
.logo-main { font-family:'Orbitron',monospace; font-weight:900; line-height:1; }
.logo-ben { font-size:52px; color:var(--green); text-shadow:0 0 50px var(--green-glow), 0 0 100px rgba(0,255,136,0.2); }
.logo-10 { font-size:52px; color:var(--text); }
.logo-sub { font-family:'Orbitron',monospace; font-size:16px; letter-spacing:0.35em; color:var(--text-mid); margin-top:6px; }
.logo-tag { font-size:12px; color:var(--text-dim); letter-spacing:0.12em; margin-top:10px; }

.omnitrix-wrap { z-index:1; display:flex; flex-direction:column; align-items:center; }
.omnitrix-ring {
  width:150px; height:150px; border-radius:50%;
  border:2px solid var(--green);
  box-shadow:0 0 40px var(--green-glow), inset 0 0 40px var(--green-dim);
  display:flex; align-items:center; justify-content:center;
  animation:pulseRing 3s ease-in-out infinite;
}
.omnitrix-ring::before { content:''; position:absolute; width:130px; height:130px; border-radius:50%; border:1px solid var(--green-dim); }
.omnitrix-hex {
  width:72px; height:72px; background:var(--green);
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  display:flex; align-items:center; justify-content:center;
  animation:spinSlow 18s linear infinite;
  box-shadow:0 0 24px var(--green);
}
.omnitrix-hex svg { width:36px; height:36px; fill:#000; }
@keyframes pulseRing { 0%,100%{box-shadow:0 0 40px var(--green-glow),inset 0 0 40px var(--green-dim)} 50%{box-shadow:0 0 80px var(--green-glow),inset 0 0 60px var(--green-dim)} }
@keyframes spinSlow { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

.menu-btns { z-index:1; width:100%; max-width:310px; display:flex; flex-direction:column; gap:12px; }
.btn-menu {
  font-family:'Orbitron',monospace; font-size:13px; font-weight:700; letter-spacing:0.15em;
  padding:15px 20px; background:transparent; color:var(--green);
  border:1.5px solid var(--green); cursor:pointer; position:relative; overflow:hidden;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%); transition:all 0.2s;
}
.btn-menu::before { content:''; position:absolute; inset:0; background:var(--green-dim); transform:translateX(-100%); transition:transform 0.3s; }
.btn-menu:hover::before, .btn-menu:active::before { transform:translateX(0); }
.btn-menu.sec { color:var(--text-dim); border-color:var(--border2); font-size:11px; }
.btn-menu.sec::before { background:var(--bg3); }

/* ════════════════════════════════
   GAME SCREEN
════════════════════════════════ */
#gameScreen { justify-content:flex-start; padding:0; background:var(--bg); }
.game-layout { width:100%; height:100%; display:flex; flex-direction:column; max-width:500px; margin:0 auto; overflow:hidden; }

/* ── SCOREBOARD ── */
.scoreboard {
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 12px; background:var(--bg2); border-bottom:1px solid var(--border); flex-shrink:0;
}
.score-side { display:flex; flex-direction:column; gap:2px; min-width:70px; }
.score-side.right { align-items:flex-end; }
.score-name { font-family:'Orbitron',monospace; font-size:9px; letter-spacing:0.12em; color:var(--text-dim); }
.score-val { font-family:'Orbitron',monospace; font-size:22px; font-weight:900; color:var(--green); line-height:1; }
.score-val.enemy { color:var(--enemy); }
.score-gems { display:flex; gap:5px; margin-top:3px; }
.gem { width:11px; height:11px; border-radius:50%; border:1.5px solid var(--text-dim); }
.gem.win { background:var(--green); border-color:var(--green); box-shadow:0 0 6px var(--green); }
.gem.lose { background:var(--enemy); border-color:var(--enemy); box-shadow:0 0 6px var(--enemy); }

.round-center { text-align:center; }
.round-label { font-family:'Orbitron',monospace; font-size:9px; color:var(--text-dim); letter-spacing:0.15em; }
.round-num { font-family:'Orbitron',monospace; font-size:18px; font-weight:700; color:var(--text-mid); }

/* ── BOARD ── */
.board { flex:1; display:flex; flex-direction:column; padding:4px 6px; gap:3px; min-height:0; overflow:hidden; }

/* ── ROW ── */
.row-wrap { display:flex; align-items:stretch; gap:4px; flex:1; min-height:0; }

.row-label-col { display:flex; flex-direction:column; align-items:center; justify-content:center; width:28px; flex-shrink:0; gap:3px; }
.row-icon { font-size:14px; line-height:1; }
.row-total { font-family:'Orbitron',monospace; font-size:11px; font-weight:700; }

.row {
  flex:1; border:1px solid var(--border); border-radius:6px;
  background:var(--bg2); display:flex; flex-wrap:wrap; gap:4px;
  padding:4px; align-content:flex-start; position:relative; overflow:hidden;
  transition:border-color 0.2s, box-shadow 0.2s;
}
.row.row-power  { border-color:rgba(0,204,255,0.25); }
.row.row-speed  { border-color:rgba(255,204,0,0.25); }
.row.row-light  { border-color:rgba(255,136,255,0.25); }
.row.row-power.can-drop  { border-color:var(--row-power); box-shadow:0 0 12px var(--row-power-dim) inset; }
.row.row-speed.can-drop  { border-color:var(--row-speed); box-shadow:0 0 12px var(--row-speed-dim) inset; }
.row.row-light.can-drop  { border-color:var(--row-light); box-shadow:0 0 12px var(--row-light-dim) inset; }
.row.row-power.can-drop.cosmic, .row.row-speed.can-drop.cosmic, .row.row-light.can-drop.cosmic { border-color:var(--row-cosmic); }

.row-type-tag {
  position:absolute; top:3px; right:4px;
  font-family:'Orbitron',monospace; font-size:8px; letter-spacing:0.1em;
  opacity:0.3; pointer-events:none;
}
.row-power .row-type-tag { color:var(--row-power); }
.row-speed .row-type-tag { color:var(--row-speed); }
.row-light .row-type-tag { color:var(--row-light); }

/* divider */
.board-divider { display:flex; align-items:center; gap:6px; flex-shrink:0; padding:1px 0; }
.div-line { flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--border2),transparent); }
.div-text { font-family:'Orbitron',monospace; font-size:9px; color:var(--text-dim); letter-spacing:0.12em; white-space:nowrap; }
.div-text span { color:var(--green); }

/* ── HAND ── */
.hand-bar { flex-shrink:0; background:var(--bg2); border-top:1px solid var(--border); padding:6px 8px 8px; }
.hand-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:5px; }
.hand-lbl { font-family:'Orbitron',monospace; font-size:9px; color:var(--text-dim); letter-spacing:0.12em; }
.hand-count { font-family:'Orbitron',monospace; font-size:11px; color:var(--green); }
.hand-scroll { display:flex; gap:6px; overflow-x:auto; padding-bottom:3px; scrollbar-width:none; }
.hand-scroll::-webkit-scrollbar { display:none; }

.action-row { display:flex; gap:8px; margin-top:6px; }
.btn-act {
  flex:1; font-family:'Orbitron',monospace; font-size:10px; font-weight:700;
  letter-spacing:0.1em; padding:10px 6px;
  background:transparent; cursor:pointer; border:1.5px solid;
  transition:all 0.2s;
}
.btn-pass { color:var(--text-dim); border-color:var(--border2); }
.btn-pass:hover { background:var(--bg3); color:var(--text-mid); }
.btn-pass.passed { color:var(--orange); border-color:var(--orange); background:rgba(255,107,0,0.1); pointer-events:none; }
.btn-pass:disabled { opacity:0.3; cursor:not-allowed; }
.btn-exit { color:var(--text-dim); border-color:var(--border); font-size:9px; max-width:80px; }
.btn-exit:hover { color:var(--enemy); border-color:var(--enemy); }

/* ════════════════════════════════
   CARDS
════════════════════════════════ */
.card {
  border-radius:5px; border:1.5px solid var(--border2);
  background:#060f08; cursor:pointer;
  position:relative; overflow:hidden; user-select:none; flex-shrink:0;
  transition:transform 0.15s, box-shadow 0.15s;
}
.card.in-hand { width:var(--card-w); height:var(--card-h); display:flex; flex-direction:column; }
.card.on-field { width:var(--card-w-sm); height:var(--card-h-sm); display:flex; flex-direction:column; cursor:default; }
.card.in-hand:hover { transform:translateY(-10px); box-shadow:0 8px 20px rgba(0,0,0,0.6); }
.card.selected { transform:translateY(-14px) scale(1.05); box-shadow:0 12px 28px rgba(0,255,136,0.25); border-color:var(--green) !important; }

/* type borders */
.card.type-power  { border-color:rgba(0,204,255,0.5); }
.card.type-speed  { border-color:rgba(255,204,0,0.5); }
.card.type-light  { border-color:rgba(255,136,255,0.5); }
.card.type-cosmic { border-color:rgba(255,255,255,0.4); }

/* rarity glows */
.card.rare     { box-shadow:0 0 10px rgba(74,138,255,0.2); }
.card.epic     { box-shadow:0 0 14px rgba(170,68,255,0.25); }
.card.legendary { animation:legendGlow 2s ease-in-out infinite; }
@keyframes legendGlow { 0%,100%{box-shadow:0 0 18px rgba(255,170,0,0.3)} 50%{box-shadow:0 0 35px rgba(255,170,0,0.55)} }

/* card inner */
.card-img { flex:1; width:100%; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#040a05; min-height:0; }
.card-img img { width:100%; height:100%; object-fit:cover; display:block; }
.card-img .no-img { font-size:26px; }
.card-img.sm .no-img { font-size:18px; }

.card-foot {
  display:flex; align-items:center; justify-content:space-between;
  padding:3px 5px; background:rgba(0,0,0,0.7); border-top:1px solid var(--border); flex-shrink:0;
}
.card-power-val {
  font-family:'Orbitron',monospace; font-weight:900; color:var(--green);
  font-size:15px; line-height:1;
}
.card-power-val.sm { font-size:12px; }
.card-power-val.buffed { color:#ffff44; text-shadow:0 0 8px #ffff44; }
.card-power-val.debuffed { color:var(--enemy); }

.card-type-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.dot-power  { background:var(--row-power); box-shadow:0 0 5px var(--row-power); }
.dot-speed  { background:var(--row-speed); box-shadow:0 0 5px var(--row-speed); }
.dot-light  { background:var(--row-light); box-shadow:0 0 5px var(--row-light); }
.dot-cosmic { background:var(--row-cosmic); box-shadow:0 0 5px var(--row-cosmic); }

/* card name tooltip on hover */
.card-name-tip {
  position:absolute; bottom:22px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.92); border:1px solid var(--border2);
  font-family:'Orbitron',monospace; font-size:7px; color:var(--text);
  padding:3px 6px; white-space:nowrap; border-radius:3px;
  opacity:0; transition:opacity 0.15s; pointer-events:none; z-index:10;
  letter-spacing:0.08em;
}
.card.in-hand:hover .card-name-tip { opacity:1; }

/* ability badge on field */
.card-ability-tag {
  position:absolute; top:2px; left:2px;
  font-size:7px; background:rgba(0,0,0,0.8);
  color:var(--text-mid); padding:1px 3px; border-radius:2px;
  line-height:1.2; max-width:50px; pointer-events:none;
}

/* enemy back */
.card-back {
  width:var(--card-w-sm); height:var(--card-h-sm); border-radius:5px;
  border:1.5px solid var(--enemy-dim); background:var(--enemy-dim);
  display:flex; align-items:center; justify-content:center;
  font-size:22px; flex-shrink:0; color:var(--enemy);
}

/* play anim */
@keyframes cardPlay { from{transform:scale(1.25) translateY(-10px);opacity:0} to{transform:scale(1) translateY(0);opacity:1} }
.play-anim { animation:cardPlay 0.25s ease-out; }

/* row highlight when card selected */
.row.highlight-power { border-color:var(--row-power) !important; box-shadow:0 0 14px var(--row-power-dim) inset; animation:rowPulse 1s ease-in-out infinite; }
.row.highlight-speed { border-color:var(--row-speed) !important; box-shadow:0 0 14px var(--row-speed-dim) inset; animation:rowPulse 1s ease-in-out infinite; }
.row.highlight-light { border-color:var(--row-light) !important; box-shadow:0 0 14px var(--row-light-dim) inset; animation:rowPulse 1s ease-in-out infinite; }
.row.highlight-cosmic { border-color:var(--row-cosmic) !important; box-shadow:0 0 14px rgba(255,255,255,0.08) inset; animation:rowPulse 1s ease-in-out infinite; }
@keyframes rowPulse { 0%,100%{opacity:1} 50%{opacity:0.7} }

/* ── AI THINKING ── */
.ai-tag {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  font-family:'Orbitron',monospace; font-size:9px; color:var(--enemy);
  letter-spacing:0.15em; background:var(--bg2);
  padding:5px 12px; border:1px solid var(--enemy); border-radius:3px;
  opacity:0; transition:opacity 0.3s; pointer-events:none; z-index:5; white-space:nowrap;
}
.ai-tag.show { opacity:1; }

/* ════════════════════════════════
   OVERLAY
════════════════════════════════ */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:200; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.35s; }
.overlay.show { opacity:1; pointer-events:all; }
.overlay-box {
  background:var(--bg2); border:1.5px solid var(--green);
  padding:32px 28px; text-align:center; max-width:290px; width:90%;
  box-shadow:0 0 80px var(--green-dim);
  clip-path:polygon(12px 0%,100% 0%,calc(100% - 12px) 100%,0% 100%);
}
.overlay-box.lose { border-color:var(--enemy); box-shadow:0 0 80px var(--enemy-dim); }
.ov-title { font-family:'Orbitron',monospace; font-size:30px; font-weight:900; color:var(--green); margin-bottom:8px; }
.ov-title.lose { color:var(--enemy); }
.ov-sub { font-size:13px; color:var(--text-dim); margin-bottom:24px; line-height:1.7; }
.ov-btns { display:flex; flex-direction:column; gap:10px; }

/* ── TOAST ── */
.toast {
  position:fixed; top:72px; left:50%; transform:translateX(-50%);
  background:var(--bg3); border:1px solid var(--border2);
  padding:7px 18px; font-family:'Orbitron',monospace; font-size:10px;
  color:var(--text-mid); letter-spacing:0.1em; border-radius:3px;
  z-index:100; opacity:0; transition:opacity 0.25s; white-space:nowrap; pointer-events:none;
}
.toast.show { opacity:1; }

/* ════════════════════════════════
   COLLECTION SCREEN
════════════════════════════════ */
#colScreen { justify-content:flex-start; padding:0; }
.col-head { width:100%; padding:14px 18px; background:var(--bg2); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:14px; flex-shrink:0; z-index:1; }
.col-title { font-family:'Orbitron',monospace; font-size:14px; color:var(--green); }
.col-back { background:none; border:1px solid var(--border2); color:var(--text-dim); font-family:'Orbitron',monospace; font-size:9px; padding:5px 10px; cursor:pointer; }
.col-back:hover { border-color:var(--green); color:var(--green); }
.col-count { font-family:'Orbitron',monospace; font-size:10px; color:var(--text-dim); margin-left:auto; }

.col-grid { flex:1; overflow-y:auto; padding:14px; display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; width:100%; max-width:500px; align-content:start; }
.col-item { border-radius:6px; border:1.5px solid var(--border2); background:#060f08; display:flex; flex-direction:column; align-items:center; padding:8px 4px 6px; gap:3px; }
.col-img { width:54px; height:70px; border-radius:4px; overflow:hidden; background:#040a05; display:flex; align-items:center; justify-content:center; font-size:28px; }
.col-img img { width:100%; height:100%; object-fit:cover; }
.col-name { font-family:'Orbitron',monospace; font-size:6px; text-align:center; color:var(--text); line-height:1.3; }
.col-pow { font-family:'Orbitron',monospace; font-size:14px; font-weight:700; color:var(--green); }
.col-type-dot { width:7px; height:7px; border-radius:50%; }

/* scrollbar */
::-webkit-scrollbar { width:3px; height:3px; }
::-webkit-scrollbar-track { background:var(--bg2); }
::-webkit-scrollbar-thumb { background:var(--border2); border-radius:2px; }

/* fade in */
@keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
.fade-up { animation:fadeUp 0.5s ease-out both; }
</style>
</head>
<body>

<!-- ═══ MENU ═══ -->
<div id="menuScreen" class="screen">
  <div class="logo-area fade-up">
    <div class="logo-eyebrow">omnitrix gaming</div>
    <div class="logo-main"><span class="logo-ben">BEN</span><span class="logo-10">10</span></div>
    <div class="logo-sub">CARD CLASH</div>
    <div class="logo-tag">alien gücünü kart masasına gətir</div>
  </div>

  <div class="omnitrix-wrap">
    <div class="omnitrix-ring">
      <div class="omnitrix-hex">
        <svg viewBox="0 0 40 40"><ellipse cx="20" cy="20" rx="12" ry="16"/><rect x="8" y="18" width="24" height="4" rx="2"/></svg>
      </div>
    </div>
  </div>

  <div class="menu-btns fade-up">
    <button class="btn-menu" onclick="startGame()">▶ &nbsp;TEK OYUNÇU</button>
    <button class="btn-menu sec" onclick="showCollection()">☰ &nbsp;KOLLEKSİYA</button>
  </div>
</div>

<!-- ═══ GAME ═══ -->
<div id="gameScreen" class="screen hidden">
  <div class="game-layout">

    <!-- scoreboard -->
    <div class="scoreboard">
      <div class="score-side">
        <div class="score-name">YAPay ZEKA</div>
        <div class="score-val enemy" id="aiScore">0</div>
        <div class="score-gems" id="aiGems"></div>
      </div>
      <div class="round-center">
        <div class="round-label">RAUND</div>
        <div class="round-num" id="roundNum">1 / 3</div>
      </div>
      <div class="score-side right">
        <div class="score-name">SİZ</div>
        <div class="score-val" id="playerScore">0</div>
        <div class="score-gems" id="playerGems"></div>
      </div>
    </div>

    <!-- board -->
    <div class="board">

      <!-- AI rows (top) — reversed: light → speed → power -->
      <div class="row-wrap">
        <div class="row-label-col">
          <div class="row-icon">💡</div>
          <div class="row-total" style="color:var(--row-light)" id="ai-light-total">0</div>
        </div>
        <div class="row row-light" id="ai-row-light" data-side="ai" data-type="light">
          <div class="row-type-tag">İŞIQ</div>
          <div class="ai-tag" id="aiThink">AI düşünür...</div>
        </div>
      </div>

      <div class="row-wrap">
        <div class="row-label-col">
          <div class="row-icon">⚡</div>
          <div class="row-total" style="color:var(--row-speed)" id="ai-speed-total">0</div>
        </div>
        <div class="row row-speed" id="ai-row-speed" data-side="ai" data-type="speed">
          <div class="row-type-tag">SÜRƏT</div>
        </div>
      </div>

      <div class="row-wrap">
        <div class="row-label-col">
          <div class="row-icon">💪</div>

        <div class="row-label-col">

        </div>

          <div class="row-type-tag">SÜRƏT</div>
        </div>
      </div>

      <div class="row-wrap">
        <div class="row-label-col">
          <div class="row-icon">💡</div>
          <div class="row-total" style="color:var(--row-light)" id="p-light-total">0</div>
        </div>
        <div class="row row-light" id="p-row-light" data-side="player" data-type="light" onclick="onRowClick('light')">
          <div class="row-type-tag">İŞIQ</div>
        </div>
      </div>

    </div>

    <!-- hand bar -->
    <div class="hand-bar">
      <div class="hand-top">
        <div class="hand-lbl">ELİNİZDƏKİ KARTLAR</div>
        <div class="hand-count" id="handCount">0</div>
      </div>
      <div class="hand-scroll" id="handCards"></div>
      <div class="action-row">
        <button class="btn-act btn-pass" id="passBtn" onclick="playerPass()">⏭ PASS</button>
        <button class="btn-act btn-exit" onclick="exitGame()">✕ MENYU</button>

  </div>

<div class="overlay" id="resultOverlay">
  <div class="overlay-box" id="resultBox">
    <div class="ov-title" id="resultTitle">QALİB!</div>
    <div class="ov-sub" id="resultSub"></div>
    <div class="ov-btns">
      <button class="btn-menu" onclick="startGame()">▶ YENİDƏN OYNA</button>
      <button class="btn-menu sec" onclick="showMenu()">← MENYU</button>
    </div>
  </div>
</div>

<!-- ═══ TOAST ═══ -->
<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════
//  CARD DEFINITIONS
//  type: 'power' | 'speed' | 'light' | 'cosmic'
//  rarity: 'common' | 'rare' | 'epic' | 'legendary'
//  abilityFn: null | string key
//  power: base strength value
// ════════════════════════════════════════
const CARDS = [
  { id:1,  name:'HEATBLAST',     type:'power',  power:4,  rarity:'common',    ability:'Adi',          abilityFn:null },
  { id:2,  name:'XLR8',          type:'speed',  power:5,  rarity:'common',    ability:'Sürət +1',     abilityFn:'speedBoost' },
  { id:3,  name:'WILDMUTT',      type:'power',  power:4,  rarity:'common',    ability:'Adi',          abilityFn:null },
  { id:4,  name:'GHOSTFREAK',    type:'light',  power:3,  rarity:'common',    ability:'Düşmən -1',    abilityFn:'debuff1' },
  { id:5,  name:'STINKFLY',      type:'speed',  power:3,  rarity:'common',    ability:'Adi',          abilityFn:null },
  { id:6,  name:'RIPJAWS',       type:'power',  power:5,  rarity:'common',    ability:'Adi',          abilityFn:null },
  { id:7,  name:'UPGRADE',       type:'light',  power:3,  rarity:'common',    ability:'Sahə +1',      abilityFn:'buffRow' },
  { id:8,  name:'GREY MATTER',   type:'light',  power:2,  rarity:'common',    ability:'Kart çək',     abilityFn:'draw1' },
  { id:9,  name:'FOUR ARMS',     type:'power',  power:7,  rarity:'rare',      ability:'Güclü zərbə',  abilityFn:null },
  { id:10, name:'DIAMONDHEAD',   type:'power',  power:6,  rarity:'rare',      ability:'Əks +2',       abilityFn:'reflect2' },
  { id:11, name:'CANNONBOLT',    type:'speed',  power:6,  rarity:'rare',      ability:'Hamı +1',      abilityFn:'buffAll' },
  { id:12, name:'BLITZWOLFER',   type:'speed',  power:5,  rarity:'rare',      ability:'Düşmən -2',    abilityFn:'debuff2' },
  { id:13, name:'SNARE-OH',      type:'light',  power:5,  rarity:'rare',      ability:'Özü +1',       abilityFn:'selfBuff1' },
  { id:14, name:'FRANKENSTRIKE', type:'cosmic', power:6,  rarity:'rare',      ability:'Hamı +1',      abilityFn:'buffAll' },
  { id:15, name:'WAY BIG',       type:'power',  power:10, rarity:'epic',      ability:'Nəhəng güc',   abilityFn:null },
  { id:16, name:'SWAMPFIRE',     type:'light',  power:8,  rarity:'epic',      ability:'Özü +2',       abilityFn:'selfBuff2' },
  { id:17, name:'CHROMASTONE',   type:'cosmic', power:8,  rarity:'epic',      ability:'Hamı +2',      abilityFn:'buffAll2' },
  { id:18, name:'HUMUNGOUSAUR',  type:'power',  power:9,  rarity:'epic',      ability:'Güclü',        abilityFn:null },
  { id:19, name:'ALIEN X',       type:'cosmic', power:15, rarity:'legendary', ability:'Misilsiz',     abilityFn:null },
  { id:20, name:'FEEDBACK',      type:'cosmic', power:12, rarity:'legendary', ability:'Düşmən -4',    abilityFn:'debuff4' },
];

const TYPE_COLOR = { power:'var(--row-power)', speed:'var(--row-speed)', light:'var(--row-light)', cosmic:'var(--row-cosmic)' };
const TYPE_DOT   = { power:'dot-power', speed:'dot-speed', light:'dot-light', cosmic:'dot-cosmic' };
const TYPE_NAME  = { power:'GÜC', speed:'SÜRƏT', light:'İŞIQ', cosmic:'KOSMİK' };
const ROWS       = ['power', 'speed', 'light'];

// ════════════════════════════════════════
//  GAME STATE
// ════════════════════════════════════════
let GS = {};
let selectedCard = null;

function newCard(def) {
  return { ...def, uid: Math.random().toString(36).slice(2,9), cur: def.power };
}

function initGS() {
  GS = {
    round: 1,
    pWins: 0, aiWins: 0,
    pHand: [], aiHand: [],
    pRows: { power:[], speed:[], light:[] },
    aiRows: { power:[], speed:[], light:[] },
    pPassed: false, aiPassed: false,
    busy: false, over: false,
    usedIds: new Set(), // track used card ids across all rounds
  };
}

// Shuffle array in place (Fisher-Yates)
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function dealHands() {
  // Available cards = not yet used this game
  const available = CARDS.filter(c => !GS.usedIds.has(c.id));
  shuffle(available);

  // Need 20 cards total (10 each). If not enough, reset used pool.
  if (available.length < 20) {
    GS.usedIds.clear();
    const refreshed = shuffle([...CARDS]);
    const pSlice  = refreshed.slice(0, 10);
    const aiSlice = refreshed.slice(10, 20);
    pSlice.forEach(c => GS.usedIds.add(c.id));
    aiSlice.forEach(c => GS.usedIds.add(c.id));
    GS.pHand  = pSlice.map(newCard);
    GS.aiHand = aiSlice.map(newCard);
    return;
  }

  const pSlice  = available.slice(0, 10);
  const aiSlice = available.slice(10, 20);
  pSlice.forEach(c => GS.usedIds.add(c.id));
  aiSlice.forEach(c => GS.usedIds.add(c.id));
  GS.pHand  = pSlice.map(newCard);
  GS.aiHand = aiSlice.map(newCard);
}

function rowTotal(rows, type) { return rows[type].reduce((s,c)=>s+c.cur,0); }
function sideTotal(rows) { return ROWS.reduce((s,t)=>s+rowTotal(rows,t),0); }

// ════════════════════════════════════════
//  ABILITIES
// ════════════════════════════════════════
function applyAbility(card, isPlayer, rowType) {
  const myRows  = isPlayer ? GS.pRows  : GS.aiRows;
  const oppRows = isPlayer ? GS.aiRows : GS.pRows;
  const myRow   = myRows[rowType];
  const lastOpp = ROWS.map(t => oppRows[t]).flat().slice(-1)[0];

  switch (card.abilityFn) {
    case 'speedBoost':
      card.cur += 1; break;
    case 'selfBuff1':
      card.cur += 1; break;
    case 'selfBuff2':
      card.cur += 2; break;
    case 'buffRow':
      myRow.forEach((c, i) => { if (i < myRow.length - 1) c.cur += 1; }); break;
    case 'buffAll':
      Object.values(myRows).flat().forEach(c => { if (c.uid !== card.uid) c.cur += 1; }); break;
    case 'buffAll2':
      Object.values(myRows).flat().forEach(c => { if (c.uid !== card.uid) c.cur += 2; }); break;
    case 'reflect2':
      card.cur += Math.min(Object.values(oppRows).flat().length * 1, 6); break;
    case 'debuff1':
      if (lastOpp) lastOpp.cur = Math.max(0, lastOpp.cur - 1); break;
    case 'debuff2':
      if (lastOpp) lastOpp.cur = Math.max(0, lastOpp.cur - 2); break;
    case 'debuff4':
      if (lastOpp) lastOpp.cur = Math.max(0, lastOpp.cur - 4); break;
    case 'draw1': {
      const remaining = CARDS.filter(c => !GS.usedIds.has(c.id));
      if (remaining.length > 0) {
        const pick = remaining[Math.floor(Math.random() * remaining.length)];
        GS.usedIds.add(pick.id);
        if (isPlayer) GS.pHand.push(newCard(pick));
        else GS.aiHand.push(newCard(pick));
      }
      break;
    }
  }
}

// ════════════════════════════════════════
//  PLAY CARD
// ════════════════════════════════════════
function playCard(card, isPlayer, rowType) {
  if (isPlayer) {
    GS.pHand = GS.pHand.filter(c => c.uid !== card.uid);
    GS.pRows[rowType].push(card);
  } else {
    GS.aiHand = GS.aiHand.filter(c => c.uid !== card.uid);
    GS.aiRows[rowType].push(card);
  }
  applyAbility(card, isPlayer, rowType);
  renderAll();
}

// ════════════════════════════════════════
//  AI LOGIC
// ════════════════════════════════════════
function aiTurn() {
  if (GS.aiPassed || GS.aiHand.length === 0) { aiDoPass(); return; }

  const pTot = sideTotal(GS.pRows);
  const aTot = sideTotal(GS.aiRows);

  // If player passed and AI is winning → AI passes too
  if (GS.pPassed && aTot > pTot) { aiDoPass(); return; }

  // If AI is comfortable ahead and not in last round
  if (aTot > pTot + 8 && GS.aiHand.length > 3 && Math.random() < 0.35) { aiDoPass(); return; }

  // Choose card
  let chosen;
  // prefer debuffs when losing badly
  if (pTot - aTot > 4) {
    const debuffs = GS.aiHand.filter(c => c.abilityFn && c.abilityFn.startsWith('debuff'));
    if (debuffs.length) chosen = debuffs.sort((a,b) => b.power - a.power)[0];
  }
  if (!chosen) chosen = [...GS.aiHand].sort((a,b) => b.power - a.power)[0];

  // Pick row for card
  let rowType = chosen.type === 'cosmic'
    ? ROWS[Math.floor(Math.random() * 3)]  // cosmic → any row
    : chosen.type;

  playCard(chosen, false, rowType);

  // after AI plays, check round end
  setTimeout(() => checkRoundEnd(), 200);
}

function aiDoPass() {
  GS.aiPassed = true;
  showToast('AI pass etdi');
  setTimeout(() => checkRoundEnd(), 400);
}

// ════════════════════════════════════════
//  PLAYER ACTIONS
// ════════════════════════════════════════
function onCardClick(card, el) {
  if (GS.busy || GS.pPassed || GS.over) return;

  if (selectedCard && selectedCard.uid === card.uid) {
    // deselect (toggle)
    clearSelection();
    return;
  }
  clearSelection();
  selectedCard = card;
  el.classList.add('selected');

  // highlight valid rows
  highlightRows(card.type);
  if (card.type !== 'cosmic') {
    // direct play: only one row matches
    showToast(`"${card.name}" → ${TYPE_NAME[card.type]} sahəsinə tap!`);
  } else {
    showToast(`"${card.name}" → istənilən sahəyə tap!`);
  }
}

function onRowClick(rowType) {
  if (!selectedCard || GS.busy || GS.pPassed || GS.over) return;
  const card = selectedCard;

  // validate
  if (card.type !== 'cosmic' && card.type !== rowType) {
    showToast(`Bu kart yalnız ${TYPE_NAME[card.type]} sahəsinə gedə bilər!`);
    return;
  }

  clearSelection();
  playCard(card, true, rowType);

  // AI responds
  if (!GS.aiPassed) {
    GS.busy = true;
    showAiThink(true);
    setTimeout(() => {
      showAiThink(false);
      aiTurn();
      GS.busy = false;
    }, 800 + Math.random() * 600);
  } else {
    checkRoundEnd();
  }
}

function playerPass() {
  if (GS.busy || GS.pPassed || GS.over) return;
  clearSelection();
  GS.pPassed = true;

  const btn = document.getElementById('passBtn');
  btn.textContent = '✓ PASS ETDİNİZ';
  btn.classList.add('passed');

  showToast('Pass etdiniz');

  if (!GS.aiPassed) {
    GS.busy = true;
    showAiThink(true);
    setTimeout(() => {
      showAiThink(false);
      aiTurn();
      GS.busy = false;
    }, 700 + Math.random() * 500);
  } else {
    checkRoundEnd();
  }
}

// ════════════════════════════════════════
//  ROUND END
// ════════════════════════════════════════
function checkRoundEnd() {
  if (!GS.pPassed || !GS.aiPassed) return;

  const pT = sideTotal(GS.pRows);
  const aT = sideTotal(GS.aiRows);

  setTimeout(() => {
    let msg = '';
    if (pT > aT) { GS.pWins++; msg = `Raund ${GS.round} qazandınız! (${pT} vs ${aT})`; }
    else if (aT > pT) { GS.aiWins++; msg = `AI raund ${GS.round} qazandı! (${aT} vs ${pT})`; }
    else { msg = `Raund ${GS.round} bərabər! (${pT})`; }

    showToast(msg);
    renderScoreboard();

    if (GS.pWins >= 2 || GS.aiWins >= 2 || GS.round >= 3) {
      setTimeout(() => endGame(), 1400);
    } else {
      GS.round++;
      setTimeout(() => nextRound(), 1600);
    }
  }, 300);
}

function nextRound() {
  GS.pRows  = { power:[], speed:[], light:[] };
  GS.aiRows = { power:[], speed:[], light:[] };
  GS.pPassed = false;
  GS.aiPassed = false;
  GS.busy = false;

  const btn = document.getElementById('passBtn');
  btn.textContent = '⏭ PASS';
  btn.classList.remove('passed');
  btn.disabled = false;

  // Fresh 10 cards each for the new round (unique, not reused)
  dealHands();
  renderAll();
}

// ════════════════════════════════════════
//  END GAME
// ════════════════════════════════════════
function endGame() {
  GS.over = true;
  const won = GS.pWins > GS.aiWins;
  const draw = GS.pWins === GS.aiWins;
  const box   = document.getElementById('resultBox');
  const title = document.getElementById('resultTitle');
  const sub   = document.getElementById('resultSub');

  if (draw) {
    title.textContent = 'BƏRABƏR!'; title.className = 'ov-title'; box.className = 'overlay-box';
    sub.innerHTML = `Güclər bərabər idi<br>Raund: ${GS.pWins} — ${GS.aiWins}`;
  } else if (won) {
    title.textContent = 'QALİB!'; title.className = 'ov-title'; box.className = 'overlay-box';
    sub.innerHTML = `Siz AI-ı məğlub etdiniz!<br>Raund: ${GS.pWins} — ${GS.aiWins}`;
  } else {
    title.textContent = 'MƏĞLUB!'; title.className = 'ov-title lose'; box.className = 'overlay-box lose';
    sub.innerHTML = `AI sizi məğlub etdi<br>Raund: ${GS.pWins} — ${GS.aiWins}`;
  }
  document.getElementById('resultOverlay').classList.add('show');
}

// ════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════
function renderAll() {
  renderRows();
  renderHand();
  renderScoreboard();
  updateDivText();
}

function renderRows() {
  ROWS.forEach(type => {
    renderRow(`p-row-${type}`,  GS.pRows[type],  true);
    renderRow(`ai-row-${type}`, GS.aiRows[type], false);
    document.getElementById(`p-${type}-total`).textContent  = rowTotal(GS.pRows, type);
    document.getElementById(`ai-${type}-total`).textContent = rowTotal(GS.aiRows, type);
  });
}

function renderRow(elId, cards, isPlayer) {
  const el = document.getElementById(elId);
  // preserve special children
  const aiTag  = el.querySelector('.ai-tag');
  const rowTag = el.querySelector('.row-type-tag');
  el.innerHTML = '';
  if (aiTag)  el.appendChild(aiTag);
  if (rowTag) el.appendChild(rowTag);

  cards.forEach(card => {
    const div = document.createElement('div');
    div.className = `card on-field type-${card.type} ${card.rarity} play-anim`;
    div.innerHTML = fieldCardHTML(card);
    el.appendChild(div);
  });
}

function fieldCardHTML(card) {
  const pwClass = card.cur > card.power ? 'buffed' : card.cur < card.power ? 'debuffed' : '';
  return `
    <div class="card-img sm">
      <img src="cards/${card.id}.png" alt="${card.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="no-img" style="display:none">👾</div>
    </div>
    ${card.ability !== 'Adi' && card.ability !== 'Güclü zərbə' && card.ability !== 'Güclü' && card.ability !== 'Nəhəng güc' && card.ability !== 'Misilsiz' ? `<div class="card-ability-tag">${card.ability}</div>` : ''}
    <div class="card-foot">
      <div class="card-power-val sm ${pwClass}">${card.cur}</div>
      <div class="card-type-dot ${TYPE_DOT[card.type]}"></div>
    </div>
  `;
}

function renderHand() {
  const el = document.getElementById('handCards');
  el.innerHTML = '';
  GS.pHand.forEach(card => {
    const div = document.createElement('div');
    div.className = `card in-hand type-${card.type} ${card.rarity}`;
    div.innerHTML = handCardHTML(card);
    div.onclick = () => onCardClick(card, div);
    if (selectedCard && selectedCard.uid === card.uid) div.classList.add('selected');
    el.appendChild(div);
  });
  document.getElementById('handCount').textContent = GS.pHand.length;
}

function handCardHTML(card) {
  return `
    <div class="card-img">
      <img src="cards/${card.id}.png" alt="${card.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="no-img" style="display:none">👾</div>
    </div>
    <div class="card-name-tip">${card.name} • ${TYPE_NAME[card.type]} • ${card.power}⚡</div>
    <div class="card-foot">
      <div class="card-power-val">${card.power}</div>
      <div class="card-type-dot ${TYPE_DOT[card.type]}"></div>
    </div>
  `;
}

function renderScoreboard() {
  document.getElementById('playerScore').textContent = GS.pWins;
  document.getElementById('aiScore').textContent = GS.aiWins;
  document.getElementById('roundNum').textContent = `${GS.round} / 3`;

  ['player','ai'].forEach(side => {
    const wins = side === 'player' ? GS.pWins : GS.aiWins;
    const losses = side === 'player' ? GS.aiWins : GS.pWins;
    const el = document.getElementById(`${side}Gems`);
    el.innerHTML = '';
    for (let i = 0; i < 2; i++) {
      const gem = document.createElement('div');
      gem.className = 'gem';
      if (i < wins) gem.classList.add(side === 'player' ? 'win' : 'lose');
      else if (i < losses) gem.classList.add(side === 'player' ? 'lose' : 'win');
      el.appendChild(gem);
    }
  });
}

function updateDivText() {
  const el = document.getElementById('divText');
  let state = GS.pPassed && GS.aiPassed ? 'BİTDİ' : GS.pPassed ? 'AI OYNAYIR' : 'OYNA';
  el.innerHTML = `RAUND <span>${GS.round}</span> — ${state}`;
}

// ════════════════════════════════════════
//  SELECTION & HIGHLIGHTS
// ════════════════════════════════════════
function clearSelection() {
  selectedCard = null;
  document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
  clearHighlights();
}

function clearHighlights() {
  ROWS.forEach(t => {
    const el = document.getElementById(`p-row-${t}`);
    el.classList.remove(`highlight-power`,`highlight-speed`,`highlight-light`,`highlight-cosmic`);
  });
}

function highlightRows(cardType) {
  clearHighlights();
  ROWS.forEach(t => {
    const el = document.getElementById(`p-row-${t}`);
    if (cardType === 'cosmic' || cardType === t) {
      el.classList.add(cardType === 'cosmic' ? 'highlight-cosmic' : `highlight-${cardType}`);
    }
  });
}

// ════════════════════════════════════════
//  UI HELPERS
// ════════════════════════════════════════
function showAiThink(show) {
  document.getElementById('aiThink').classList.toggle('show', show);
}

let _toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ════════════════════════════════════════
//  SCREENS
// ════════════════════════════════════════
function showMenu() {
  ['menuScreen','gameScreen','colScreen'].forEach(id => {
    document.getElementById(id).classList.toggle('hidden', id !== 'menuScreen');
  });
  document.getElementById('resultOverlay').classList.remove('show');
}

function exitGame() {
  if (confirm('Oyundan çıxmaq istəyirsiniz?')) showMenu();
}

function startGame() {
  document.getElementById('resultOverlay').classList.remove('show');
  document.getElementById('menuScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  document.getElementById('colScreen').classList.add('hidden');

  initGS();
  dealHands();
  selectedCard = null;

  const btn = document.getElementById('passBtn');
  btn.textContent = '⏭ PASS';
  btn.classList.remove('passed');
  btn.disabled = false;

  renderAll();
}

function showCollection() {
  document.getElementById('menuScreen').classList.add('hidden');
  document.getElementById('colScreen').classList.remove('hidden');

  const grid = document.getElementById('colGrid');
  grid.innerHTML = '';

  CARDS.forEach(card => {
    const div = document.createElement('div');
    div.className = `col-item`;
    div.style.borderColor = TYPE_COLOR[card.type];
    div.innerHTML = `
      <div class="col-img">
        <img src="cards/${card.id}.png" alt="${card.name}" style="width:100%;height:100%;object-fit:cover;border-radius:3px"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div style="display:none;width:100%;height:100%;align-items:center;justify-content:center;font-size:28px">👾</div>
      </div>
      <div class="col-name">${card.name}</div>
      <div class="col-pow">${card.power}</div>
      <div class="col-type-dot ${TYPE_DOT[card.type]}" style="margin-top:1px"></div>
    `;
    grid.appendChild(div);
  });
}

// Start on menu
showMenu();
</script>
</body>
