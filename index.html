<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ben 10: Card Clash</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --green: #00ff88;
  --green-dark: #00cc66;
  --green-dim: #00ff8833;
  --orange: #ff6b00;
  --orange-dim: #ff6b0033;
  --bg: #060e08;
  --bg2: #0d1a0f;
  --bg3: #142018;
  --card-bg: #0a1a0c;
  --border: #1a3a1e;
  --text: #e8f5ea;
  --text-dim: #5a8a60;
  --common: #7a9a7e;
  --rare: #4a8aff;
  --epic: #aa44ff;
  --legendary: #ffaa00;
  --enemy: #ff3344;
  --enemy-dim: #ff334422;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html,body { width:100%; height:100%; overflow:hidden; background:#000; }
body { font-family:'Exo 2', sans-serif; color:var(--text); }

/* ─── SCREENS ─── */
.screen { 
  position:fixed; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:var(--bg); transition:opacity 0.4s;
}
.screen.hidden { opacity:0; pointer-events:none; }

/* grid bg */
.screen::before {
  content:''; position:absolute; inset:0; pointer-events:none;
  background-image: 
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 40px 40px;
  opacity:0.4;
}

/* ─── MENU ─── */
#menuScreen { gap:0; justify-content:space-between; padding:40px 24px 50px; }

.logo-area { text-align:center; z-index:1; }
.logo-sub { font-family:'Orbitron',monospace; font-size:11px; letter-spacing:0.3em; color:var(--text-dim); margin-bottom:8px; }
.logo-main { font-family:'Orbitron',monospace; font-size:36px; font-weight:900; color:var(--green); line-height:1; text-shadow:0 0 40px var(--green); }
.logo-main span { color:var(--text); }
.logo-tagline { font-size:12px; color:var(--text-dim); letter-spacing:0.15em; margin-top:8px; }

.omnitrix-display {
  z-index:1; display:flex; flex-direction:column; align-items:center; gap:12px;
}
.omnitrix-ring {
  width:160px; height:160px; border-radius:50%;
  border:3px solid var(--green);
  box-shadow:0 0 30px var(--green), inset 0 0 30px var(--green-dim);
  display:flex; align-items:center; justify-content:center;
  animation: pulse-ring 3s ease-in-out infinite;
  position:relative;
}
.omnitrix-ring::before {
  content:''; position:absolute; inset:8px; border-radius:50%;
  border:1px solid var(--green-dim);
}
.omnitrix-center {
  width:80px; height:80px; background:var(--green);
  clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
  display:flex; align-items:center; justify-content:center;
  animation: spin-slow 20s linear infinite;
  box-shadow:0 0 20px var(--green);
}
.omnitrix-center svg { width:40px; height:40px; fill:#000; }
@keyframes pulse-ring { 0%,100%{box-shadow:0 0 30px var(--green),inset 0 0 30px var(--green-dim)} 50%{box-shadow:0 0 60px var(--green),inset 0 0 50px var(--green-dim)} }
@keyframes spin-slow { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

.menu-buttons { z-index:1; width:100%; display:flex; flex-direction:column; gap:14px; max-width:320px; }
.btn-main {
  font-family:'Orbitron',monospace; font-size:14px; font-weight:700;
  letter-spacing:0.15em; padding:16px 24px;
  background:transparent; color:var(--green);
  border:1.5px solid var(--green); cursor:pointer;
  position:relative; overflow:hidden; transition:all 0.2s;
  clip-path:polygon(8px 0%,100% 0%,calc(100% - 8px) 100%,0% 100%);
}
.btn-main::before {
  content:''; position:absolute; inset:0;
  background:var(--green-dim); transform:translateX(-100%); transition:transform 0.3s;
}
.btn-main:hover::before, .btn-main:active::before { transform:translateX(0); }
.btn-main:hover { box-shadow:0 0 20px var(--green-dim); }
.btn-main.secondary { color:var(--text-dim); border-color:var(--border); font-size:12px; }
.btn-main.secondary::before { background:var(--bg3); }

/* ─── GAME SCREEN ─── */
#gameScreen {
  justify-content:flex-start; padding:0;
  background:var(--bg);
}

.game-layout {
  width:100%; height:100%; display:flex; flex-direction:column;
  max-width:480px; margin:0 auto; position:relative;
}

/* status bar */
.status-bar {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px; background:var(--bg2);
  border-bottom:1px solid var(--border); z-index:10; flex-shrink:0;
}
.status-player { display:flex; flex-direction:column; gap:2px; }
.status-name { font-family:'Orbitron',monospace; font-size:10px; color:var(--text-dim); letter-spacing:0.1em; }
.status-score { font-family:'Orbitron',monospace; font-size:18px; font-weight:700; color:var(--green); }
.status-score.enemy { color:var(--enemy); }
.round-info { text-align:center; }
.round-label { font-family:'Orbitron',monospace; font-size:9px; color:var(--text-dim); letter-spacing:0.15em; }
.round-dots { display:flex; gap:6px; justify-content:center; margin-top:4px; }
.round-dot { width:10px; height:10px; border-radius:50%; border:1.5px solid var(--text-dim); }
.round-dot.win { background:var(--green); border-color:var(--green); }
.round-dot.lose { background:var(--enemy); border-color:var(--enemy); }

/* battle zone */
.battle-zone {
  flex:1; display:flex; flex-direction:column;
  padding:10px 12px; gap:8px; overflow:hidden; min-height:0;
}

.field-label {
  font-family:'Orbitron',monospace; font-size:9px; letter-spacing:0.15em;
  color:var(--text-dim); margin-bottom:4px;
}

.field {
  flex:1; min-height:0;
  border:1px solid var(--border); border-radius:8px;
  background:var(--bg2); padding:8px;
  display:flex; flex-wrap:wrap; gap:6px;
  align-content:flex-start; position:relative; overflow:hidden;
}
.field.enemy-field { border-color:var(--enemy-dim); }
.field.player-field { border-color:var(--green-dim); }

.field-power {
  position:absolute; bottom:6px; right:8px;
  font-family:'Orbitron',monospace; font-size:20px; font-weight:700;
  opacity:0.6;
}
.enemy-field .field-power { color:var(--enemy); }
.player-field .field-power { color:var(--green); }

/* divider */
.battle-divider {
  display:flex; align-items:center; gap:8px; flex-shrink:0;
}
.divider-line { flex:1; height:1px; background:var(--border); }
.divider-info {
  font-family:'Orbitron',monospace; font-size:10px; color:var(--text-dim);
  letter-spacing:0.1em; white-space:nowrap;
}
.divider-info span { color:var(--green); }

/* hand area */
.hand-area {
  flex-shrink:0; padding:8px 12px 12px;
  background:var(--bg2); border-top:1px solid var(--border);
}
.hand-label {
  font-family:'Orbitron',monospace; font-size:9px; letter-spacing:0.15em;
  color:var(--text-dim); margin-bottom:6px;
}
.hand-cards {
  display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;
  scrollbar-width:none;
}
.hand-cards::-webkit-scrollbar { display:none; }

.action-btns {
  display:flex; gap:8px; margin-top:8px;
}
.btn-action {
  flex:1; font-family:'Orbitron',monospace; font-size:11px; font-weight:700;
  letter-spacing:0.1em; padding:11px 8px;
  background:transparent; cursor:pointer; border:1.5px solid;
  transition:all 0.2s;
}
.btn-pass { color:var(--text-dim); border-color:var(--border); }
.btn-pass:hover { background:var(--bg3); }
.btn-pass:disabled { opacity:0.3; cursor:not-allowed; }
.btn-pass.passed { color:var(--orange); border-color:var(--orange); background:var(--orange-dim); }

/* ─── CARDS ─── */
.card {
  border-radius:6px; border:1.5px solid;
  background:var(--card-bg); cursor:pointer;
  transition:all 0.2s; position:relative; overflow:hidden;
  user-select:none; flex-shrink:0;
}
.card.in-hand {
  width:90px; height:130px; display:flex; flex-direction:column;
}
.card.on-field {
  width:70px; height:100px; display:flex; flex-direction:column;
  cursor:default;
}
.card.in-hand:hover { transform:translateY(-8px); }
.card.in-hand:active { transform:translateY(-4px) scale(0.97); }
.card.selected { transform:translateY(-12px); }

/* rarity colors */
.card.common { border-color:var(--common); }
.card.rare { border-color:var(--rare); box-shadow:0 0 10px #4a8aff33; }
.card.epic { border-color:var(--epic); box-shadow:0 0 12px #aa44ff33; }
.card.legendary { border-color:var(--legendary); box-shadow:0 0 16px #ffaa0044; animation:legendary-glow 2s ease-in-out infinite; }
@keyframes legendary-glow { 0%,100%{box-shadow:0 0 16px #ffaa0044} 50%{box-shadow:0 0 30px #ffaa0066} }

.card-top {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center; padding:4px; gap:2px;
}
.card-emoji { font-size:28px; line-height:1; }
.card-emoji.sm { font-size:20px; }
.card-name {
  font-family:'Orbitron',monospace; font-size:7px; font-weight:700;
  text-align:center; letter-spacing:0.05em; color:var(--text);
  line-height:1.2; padding:0 2px;
}
.card-name.sm { font-size:6px; }
.card-ability {
  font-size:7px; color:var(--text-dim); text-align:center;
  padding:0 4px; line-height:1.3;
}

.card-bottom {
  display:flex; align-items:center; justify-content:space-between;
  padding:4px 6px; border-top:1px solid var(--border);
  background:#00000033;
}
.card-power {
  font-family:'Orbitron',monospace; font-weight:700;
  color:var(--green);
}
.card-power.sm { font-size:14px; }
.card-power.lg { font-size:18px; }
.card-power.buffed { color:#ffff44; }
.card-power.debuffed { color:var(--enemy); }
.card-type-badge {
  font-size:6px; letter-spacing:0.05em; padding:1px 4px;
  border-radius:2px; font-weight:600; text-transform:uppercase;
}
.badge-atk { background:#ff330022; color:#ff6666; border:0.5px solid #ff3300; }
.badge-sup { background:#0044ff22; color:#6688ff; border:0.5px solid #0044ff; }
.badge-trc { background:#ffaa0022; color:#ffcc44; border:0.5px solid #ffaa00; }

/* enemy card back */
.card-back {
  width:70px; height:100px; border-radius:6px;
  border:1.5px solid var(--enemy);
  background:var(--enemy-dim); display:flex;
  align-items:center; justify-content:center;
  font-size:24px; flex-shrink:0;
}

/* ─── OVERLAY / RESULT ─── */
.overlay {
  position:fixed; inset:0; background:#00000099; z-index:100;
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity 0.3s;
}
.overlay.show { opacity:1; pointer-events:all; }
.overlay-box {
  background:var(--bg2); border:1.5px solid var(--green);
  padding:32px 28px; text-align:center; max-width:300px; width:90%;
  box-shadow:0 0 60px var(--green-dim);
  clip-path:polygon(12px 0%,100% 0%,calc(100% - 12px) 100%,0% 100%);
}
.overlay-box.lose { border-color:var(--enemy); box-shadow:0 0 60px var(--enemy-dim); }
.overlay-title {
  font-family:'Orbitron',monospace; font-size:28px; font-weight:900;
  color:var(--green); margin-bottom:8px;
}
.overlay-title.lose { color:var(--enemy); }
.overlay-sub { font-size:13px; color:var(--text-dim); margin-bottom:24px; line-height:1.6; }
.overlay-btns { display:flex; flex-direction:column; gap:10px; }

/* ─── MESSAGE TOAST ─── */
.toast {
  position:fixed; top:80px; left:50%; transform:translateX(-50%);
  background:var(--bg3); border:1px solid var(--green);
  padding:8px 20px; border-radius:4px; font-family:'Orbitron',monospace;
  font-size:11px; color:var(--green); letter-spacing:0.1em;
  z-index:50; opacity:0; transition:opacity 0.3s; white-space:nowrap;
  pointer-events:none;
}
.toast.show { opacity:1; }

/* ─── AI THINKING ─── */
.ai-thinking {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  font-family:'Orbitron',monospace; font-size:10px; color:var(--enemy);
  letter-spacing:0.15em; z-index:5; background:var(--bg2);
  padding:6px 14px; border:1px solid var(--enemy); border-radius:4px;
  opacity:0; transition:opacity 0.3s; pointer-events:none;
}
.ai-thinking.show { opacity:1; }

/* ─── COLLECTION SCREEN ─── */
#collectionScreen { justify-content:flex-start; padding:0; }
.col-header {
  width:100%; padding:16px 20px; background:var(--bg2);
  border-bottom:1px solid var(--border); display:flex;
  align-items:center; gap:16px; flex-shrink:0; z-index:1;
}
.col-title { font-family:'Orbitron',monospace; font-size:16px; color:var(--green); }
.col-back { background:none; border:1px solid var(--border); color:var(--text-dim);
  font-family:'Orbitron',monospace; font-size:10px; padding:6px 12px; cursor:pointer; }
.col-back:hover { border-color:var(--green); color:var(--green); }
.col-grid {
  flex:1; overflow-y:auto; padding:16px;
  display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;
  width:100%; max-width:480px; align-content:start;
}
.col-card {
  border-radius:8px; border:1.5px solid;
  background:var(--card-bg); display:flex; flex-direction:column;
  align-items:center; padding:10px 6px; gap:4px;
}
.col-card.locked { opacity:0.25; filter:grayscale(1); }
.col-card-emoji { font-size:32px; }
.col-card-name { font-family:'Orbitron',monospace; font-size:7px; text-align:center; color:var(--text); }
.col-card-power { font-family:'Orbitron',monospace; font-size:16px; font-weight:700; color:var(--green); }
.col-rarity-badge { font-size:8px; padding:2px 6px; border-radius:2px; }

/* scrollbar */
::-webkit-scrollbar { width:4px; height:4px; }
::-webkit-scrollbar-track { background:var(--bg2); }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

/* animations */
@keyframes card-play { from{transform:scale(1.3) translateY(-20px); opacity:0} to{transform:scale(1) translateY(0); opacity:1} }
.card-play-anim { animation:card-play 0.3s ease-out; }
@keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.fade-in { animation:fadeIn 0.5s ease-out both; }
</style>
</head>

<!-- MENU -->

  </div>

  <div class="menu-buttons fade-in">

    <button class="btn-main secondary" onclick="showCollection()">☰ &nbsp; KOLLEKSİYA</button>
  </div>
</div>

<!-- GAME -->
<div id="gameScreen" class="screen hidden">
  <div class="game-layout">
    <!-- status -->
    <div class="status-bar">

        <div class="status-name">YAPay ZEKA</div>

      </div>
      <div class="round-info">
        <div class="round-label">RAUND</div>

      </div>

      </div>

    <!-- battle zone -->
    <div class="battle-zone">
      <div>
        <div class="field-label">— DÜŞMƏN SAHƏSI —</div>
        <div class="field enemy-field" id="enemyField">
          <div class="ai-thinking" id="aiThinking">AI düşünür...</div>
          <div class="field-power" id="enemyFieldPower">0</div>
        </div>
      </div>

      <div class="battle-divider">
        <div class="divider-line"></div>
        <div class="divider-info" id="roundStatus">RAUND <span>1</span> — OYNA</div>
        <div class="divider-line"></div>
      </div>

      <div>
        <div class="field-label">— SİZİN SAHƏNIZ —</div>
        <div class="field player-field" id="playerField">
          <div class="field-power" id="playerFieldPower">0</div>
        </div>
      </div>
    </div>

    <!-- hand -->
    <div class="hand-area">
      <div class="hand-label">ELİNİZDƏKİ KARTLAR — <span id="handCount" style="color:var(--green)">0</span></div>
      <div class="hand-cards" id="handCards"></div>
      <div class="action-btns">
        <button class="btn-action btn-pass" id="passBtn" onclick="playerPass()">⏭ PASS</button>
        <button class="btn-action" style="color:var(--text-dim);border-color:var(--border);font-size:10px" onclick="showMenuFromGame()">✕ MENYU</button>
      </div>
    </div>
  </div>
</div>

<!-- COLLECTION -->
<div id="collectionScreen" class="screen hidden">
  <div class="col-header">
    <button class="col-back" onclick="showMenu()">← GERİ</button>
    <div class="col-title">KOLLEKSİYA</div>
    <div style="font-family:'Orbitron',monospace;font-size:10px;color:var(--text-dim);margin-left:auto" id="colCount">0 / 0</div>
  </div>
  <div class="col-grid" id="colGrid"></div>
</div>

<!-- RESULT OVERLAY -->
<div class="overlay" id="resultOverlay">
  <div class="overlay-box" id="resultBox">
    <div class="overlay-title" id="resultTitle">QALİB!</div>
    <div class="overlay-sub" id="resultSub">Əla oynadın!</div>
    <div class="overlay-btns">
      <button class="btn-main" onclick="startGame()">▶ YENİDƏN OYNA</button>
      <button class="btn-main secondary" onclick="showMenu()">← MENYU</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

  { id:'e4', name:'HUMUNGOUSAUR', emoji:'🦕', power:9, rarity:'epic', type:'atk', ability:'Güclü zərbə', abilityFn:null },
  // LEGENDARY
  { id:'l1', name:'ALIEN X', emoji:'🌌', power:15, rarity:'legendary', type:'atk', ability:'Misilsiz güc', abilityFn:null },
  { id:'l2', name:'FEEDBACK', emoji:'⚡🔋', power:12, rarity:'legendary', type:'trc', ability:'Düşmən -4', abilityFn:'debuff4' },
  { id:'l3', name:'ULTIMATE\nECHO ECHO', emoji:'🔊', power:11, rarity:'legendary', type:'sup', ability:'Hamı +3', abilityFn:'buffAll3' },
];

const RARITY_WEIGHTS = { common:60, rare:25, epic:12, legendary:3 };
const RARITY_LABELS = { common:'ADİ', rare:'NADİR', epic:'EPİK', legendary:'ƏFSANƏ' };
const RARITY_COLORS = { common:'var(--common)', rare:'var(--rare)', epic:'var(--epic)', legendary:'var(--legendary)' };
const TYPE_LABELS = { atk:'HÜCUM', sup:'DƏSTƏK', trc:'HİYLƏ' };

// ═══════════════════════════════
//  GAME STATE
// ═══════════════════════════════
let GS = {};

function initGameState() {
  GS = {
    round: 1,
    playerWins: 0,
    aiWins: 0,
    playerHand: [],
    aiHand: [],
    playerField: [],
    aiField: [],
    playerPassed: false,
    aiPassed: false,
    playerTurn: true,
    busy: false,
    gameOver: false,
  };
}

// ═══════════════════════════════
//  CARD HELPERS
// ═══════════════════════════════
function randomCard() {
  const roll = Math.random() * 100;
  let cum = 0, rarity = 'common';
  for (const [r, w] of Object.entries(RARITY_WEIGHTS)) {
    cum += w; if (roll < cum) { rarity = r; break; }
  }
  const pool = ALL_CARDS.filter(c => c.rarity === rarity);
  const base = pool[Math.floor(Math.random() * pool.length)];
  return { ...base, uid: Math.random().toString(36).slice(2), currentPower: base.power };
}

function dealHands() {
  GS.playerHand = Array.from({length:7}, randomCard);
  GS.aiHand = Array.from({length:7}, randomCard);
}

function fieldPower(field) {
  return field.reduce((s, c) => s + c.currentPower, 0);
}

// ═══════════════════════════════
//  ABILITIES
// ═══════════════════════════════
function applyAbility(card, isPlayer) {
  const myField = isPlayer ? GS.playerField : GS.aiField;
  const oppField = isPlayer ? GS.aiField : GS.playerField;

  switch(card.abilityFn) {
    case 'speed':
      card.currentPower += 1; break;
    case 'buff1':
      if (myField.length > 1) myField[myField.length-2].currentPower += 1; break;
    case 'buff2self':
      card.currentPower += 2; break;
    case 'buffAll':
      myField.forEach((c,i) => { if(i < myField.length-1) c.currentPower += 1; }); break;
    case 'buffAll2':
      myField.forEach((c,i) => { if(i < myField.length-1) c.currentPower += 2; }); break;
    case 'buffAll3':
      myField.forEach((c,i) => { if(i < myField.length-1) c.currentPower += 3; }); break;
    case 'debuff1':
      if (oppField.length > 0) { const t = oppField[oppField.length-1]; t.currentPower = Math.max(0, t.currentPower-1); } break;
    case 'debuff2':
      if (oppField.length > 0) { const t = oppField[oppField.length-1]; t.currentPower = Math.max(0, t.currentPower-2); } break;
    case 'debuff4':
      if (oppField.length > 0) { const t = oppField[oppField.length-1]; t.currentPower = Math.max(0, t.currentPower-4); } break;
    case 'reflect2':
      card.currentPower += Math.min(oppField.length * 2, 6); break;
    case 'draw1':
      const newCard = randomCard();
      if (isPlayer) { GS.playerHand.push(newCard); }
      else { GS.aiHand.push(newCard); }
      break;
  }
}

// ═══════════════════════════════
//  AI LOGIC
// ═══════════════════════════════
function aiDecide() {
  if (GS.aiPassed || GS.aiHand.length === 0) { aiPassAction(); return; }

  const pPow = fieldPower(GS.playerField);
  const aPow = fieldPower(GS.aiField);
  const diff = pPow - aPow;

  // if player passed, AI plays conservatively
  if (GS.playerPassed) {
    if (aPow > pPow) { aiPassAction(); return; }
  }

  // if losing badly, play best card
  // if winning comfortably with many cards, sometimes pass
  if (aPow > pPow + 6 && GS.aiHand.length > 3 && Math.random() < 0.4) {
    aiPassAction(); return;
  }

  // pick card: prefer debuffs if losing, else highest power
  let chosen;
  if (diff > 3) {
    const debuffs = GS.aiHand.filter(c => c.abilityFn && c.abilityFn.startsWith('debuff'));
    if (debuffs.length > 0) {
      chosen = debuffs.sort((a,b) => b.power - a.power)[0];
    }
  }
  if (!chosen) {
    chosen = GS.aiHand.sort((a,b) => b.power - a.power)[0];
  }

  playCard(chosen, false);
}

function aiPassAction() {
  GS.aiPassed = true;
  showToast('AI pass etdi');
  document.getElementById('passBtn').textContent = '⏭ AI PASS ETDİ';
  setTimeout(() => checkRoundEnd(), 400);
}

// ═══════════════════════════════
//  PLAY CARD
// ═══════════════════════════════
function playCard(card, isPlayer) {
  if (isPlayer) {
    GS.playerHand = GS.playerHand.filter(c => c.uid !== card.uid);
    GS.playerField.push(card);
    applyAbility(card, true);
  } else {
    GS.aiHand = GS.aiHand.filter(c => c.uid !== card.uid);
    GS.aiField.push(card);
    applyAbility(card, false);
  }
  renderBoard();

  if (isPlayer) {
    // after player plays, AI responds (with delay)
    if (!GS.aiPassed && !GS.playerPassed) {
      GS.busy = true;
      showAiThinking(true);
      setTimeout(() => {
        showAiThinking(false);
        aiDecide();
        GS.busy = false;
        checkRoundEnd();
      }, 900 + Math.random() * 600);
    } else {
      checkRoundEnd();
    }
  }
}

// ═══════════════════════════════
//  PLAYER PASS
// ═══════════════════════════════
function playerPass() {
  if (GS.busy || GS.playerPassed || GS.gameOver) return;
  GS.playerPassed = true;
  const btn = document.getElementById('passBtn');
  btn.textContent = '✓ PASS ETDİNİZ';
  btn.classList.add('passed');
  btn.disabled = true;
  showToast('Pass etdiniz');

  if (!GS.aiPassed) {
    GS.busy = true;
    showAiThinking(true);
    setTimeout(() => {
      showAiThinking(false);
      aiDecide();
      GS.busy = false;
      checkRoundEnd();
    }, 800 + Math.random() * 500);
  } else {
    checkRoundEnd();
  }
}

// ═══════════════════════════════
//  ROUND END
// ═══════════════════════════════
function checkRoundEnd() {
  if (!GS.playerPassed || !GS.aiPassed) return;

  const pp = fieldPower(GS.playerField);
  const ap = fieldPower(GS.aiField);

  setTimeout(() => {
    let msg = '';
    if (pp > ap) { GS.playerWins++; msg = `Raund ${GS.round} — SİZ QAZANDINIZ! (${pp} vs ${ap})`; }
    else if (ap > pp) { GS.aiWins++; msg = `Raund ${GS.round} — AI QAZANDI! (${ap} vs ${pp})`; }
    else { msg = `Raund ${GS.round} — BƏRABƏR! (${pp} vs ${ap})`; }

    showToast(msg);
    updateScores();

    if (GS.playerWins >= 2 || GS.aiWins >= 2 || GS.round >= 3) {
      setTimeout(() => endGame(), 1200);
    } else {
      GS.round++;
      setTimeout(() => nextRound(), 1500);
    }
  }, 300);
}

function nextRound() {
  GS.playerField = [];
  GS.aiField = [];
  GS.playerPassed = false;
  GS.aiPassed = false;
  GS.busy = false;

  const btn = document.getElementById('passBtn');
  btn.textContent = '⏭ PASS';
  btn.classList.remove('passed');
  btn.disabled = false;

  // deal 3 more cards each round
  for(let i=0;i<3;i++) {
    GS.playerHand.push(randomCard());
    GS.aiHand.push(randomCard());
  }
  renderBoard();
}

// ═══════════════════════════════
//  END GAME
// ═══════════════════════════════
function endGame() {
  GS.gameOver = true;
  const won = GS.playerWins > GS.aiWins;
  const draw = GS.playerWins === GS.aiWins;
  const box = document.getElementById('resultBox');
  const title = document.getElementById('resultTitle');
  const sub = document.getElementById('resultSub');

  if (draw) {
    title.textContent = 'BƏRABƏR!';
    title.className = 'overlay-title';
    sub.textContent = `Güclər bərabər idi!\nRaund: ${GS.playerWins} - ${GS.aiWins}`;
    box.className = 'overlay-box';
  } else if (won) {
    title.textContent = 'QALİB!';
    title.className = 'overlay-title';
    sub.textContent = `Siz AI-ı məğlub etdiniz!\nRaund: ${GS.playerWins} - ${GS.aiWins}`;
    box.className = 'overlay-box';
  } else {
    title.textContent = 'MƏĞLUB!';
    title.className = 'overlay-title lose';
    sub.textContent = `AI sizi məğlub etdi!\nRaund: ${GS.playerWins} - ${GS.aiWins}`;
    box.className = 'overlay-box lose';
  }
  document.getElementById('resultOverlay').classList.add('show');
}

// ═══════════════════════════════
//  RENDER
// ═══════════════════════════════
function renderBoard() {
  renderField('playerField', GS.playerField, true);
  renderField('enemyField', GS.aiField, false);
  renderHand();
  updatePowers();
  updateRoundInfo();
}

function renderField(elId, cards, isPlayer) {
  const el = document.getElementById(elId);
  // keep power div and ai-thinking
  const powerEl = el.querySelector('.field-power');
  const thinkEl = el.querySelector('.ai-thinking');
  el.innerHTML = '';
  if(thinkEl) el.appendChild(thinkEl);

  cards.forEach(card => {
    const div = document.createElement('div');
    div.className = `card on-field ${card.rarity} card-play-anim`;
    div.innerHTML = cardHTML(card, true);
    el.appendChild(div);
  });

  if(powerEl) el.appendChild(powerEl);
}

function renderHand() {
  const el = document.getElementById('handCards');
  el.innerHTML = '';
  GS.playerHand.forEach(card => {
    const div = document.createElement('div');
    div.className = `card in-hand ${card.rarity}`;
    div.innerHTML = cardHTML(card, false);
    div.onclick = () => onCardClick(card, div);
    el.appendChild(div);
  });
  document.getElementById('handCount').textContent = GS.playerHand.length;
}

function cardHTML(card, small) {
  const powerClass = card.currentPower > card.power ? 'buffed' :
                     card.currentPower < card.power ? 'debuffed' : '';
  const typeLabel = TYPE_LABELS[card.type] || card.type;
  const typeCls = card.type === 'atk' ? 'badge-atk' : card.type === 'sup' ? 'badge-sup' : 'badge-trc';
  return `
    <div class="card-top">
      <div class="card-emoji ${small?'sm':''}">${card.emoji}</div>
      <div class="card-name ${small?'sm':''}">${card.name}</div>
      ${!small ? `<div class="card-ability">${card.ability}</div>` : ''}
    </div>
    <div class="card-bottom">
      <div class="card-power ${small?'sm':'lg'} ${powerClass}">${card.currentPower}</div>
      <div class="card-type-badge ${typeCls}">${typeLabel}</div>
    </div>
  `;
}

let selectedCard = null;

function onCardClick(card, el) {
  if (GS.busy || GS.playerPassed || GS.gameOver) return;

  if (selectedCard && selectedCard.uid === card.uid) {
    // play it
    el.classList.remove('selected');
    selectedCard = null;
    playCard(card, true);
  } else {
    // deselect previous
    document.querySelectorAll('.card.selected').forEach(c => c.classList.remove('selected'));
    selectedCard = card;
    el.classList.add('selected');
    showToast('Bir daha tap — oyna!');
  }
}

function updatePowers() {
  const pp = fieldPower(GS.playerField);
  const ap = fieldPower(GS.aiField);
  document.getElementById('playerFieldPower').textContent = pp;
  document.getElementById('enemyFieldPower').textContent = ap;
}

function updateScores() {
  document.getElementById('playerScore').textContent = GS.playerWins;
  document.getElementById('aiScore').textContent = GS.aiWins;
}

function updateRoundInfo() {
  document.getElementById('roundNum').textContent = `${GS.round} / 3`;
  const status = document.getElementById('roundStatus');
  status.innerHTML = `RAUND <span>${GS.round}</span> — ${GS.playerPassed && GS.aiPassed ? 'BİTDİ' : GS.playerPassed ? 'AI OYNAYIR' : 'OYNA'}`;

  const dots = document.getElementById('roundDots');
  dots.innerHTML = '';
  for(let i=1;i<=3;i++) {
    const d = document.createElement('div');
    d.className = 'round-dot';
    if(i < GS.round || (i === GS.round && GS.playerPassed && GS.aiPassed)) {
      if(GS.playerWins >= i && GS.aiWins < i) d.classList.add('win');
      else if(GS.aiWins >= i && GS.playerWins < i) d.classList.add('lose');
    }
    dots.appendChild(d);
  }
}

// ═══════════════════════════════
//  UI HELPERS
// ═══════════════════════════════
function showAiThinking(show) {
  const el = document.getElementById('aiThinking');
  if(el) el.classList.toggle('show', show);
}

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ═══════════════════════════════
//  SCREENS
// ═══════════════════════════════
function showMenu() {
  document.getElementById('menuScreen').classList.remove('hidden');
  document.getElementById('gameScreen').classList.add('hidden');
  document.getElementById('collectionScreen').classList.add('hidden');
  document.getElementById('resultOverlay').classList.remove('show');
}

function showMenuFromGame() {
  if(confirm('Oyundan çıxmaq istəyirsiniz?')) showMenu();
}

function startGame() {
  document.getElementById('resultOverlay').classList.remove('show');
  document.getElementById('menuScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');

  initGameState();
  dealHands();

  const btn = document.getElementById('passBtn');
  btn.textContent = '⏭ PASS';
  btn.classList.remove('passed');
  btn.disabled = false;

  updateScores();
  renderBoard();
}

function showCollection() {
  document.getElementById('menuScreen').classList.add('hidden');
  document.getElementById('collectionScreen').classList.remove('hidden');

  const grid = document.getElementById('colGrid');
  grid.innerHTML = '';
  document.getElementById('colCount').textContent = `${ALL_CARDS.length} / ${ALL_CARDS.length}`;

  ALL_CARDS.forEach(card => {
    const div = document.createElement('div');
    div.className = `col-card ${card.rarity}`;
    div.style.borderColor = RARITY_COLORS[card.rarity];
    div.innerHTML = `
      <div class="col-card-emoji">${card.emoji}</div>
      <div class="col-card-name">${card.name}</div>
      <div class="col-card-power">${card.power}</div>
      <div class="col-rarity-badge" style="background:${RARITY_COLORS[card.rarity]}22;color:${RARITY_COLORS[card.rarity]};border:0.5px solid ${RARITY_COLORS[card.rarity]}">${RARITY_LABELS[card.rarity]}</div>
      <div style="font-size:7px;color:var(--text-dim);text-align:center;margin-top:2px">${card.ability}</div>
    `;
    grid.appendChild(div);
  });
}
</script>
